name: Deploy to cPanel
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build Next.js static export
        run: npm run build
        env:
          NEXT_PUBLIC_WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}

      # FTP_USERNAME/FTP_PASSWORD are now the cPanel main-account
      # special FTP user (`mgeengco`), which is rooted at
      # /home/mgeengco/ (no chroot). So `public_html/out/` resolves
      # cleanly to /home/mgeengco/public_html/out/ — the directory
      # mge-eng.com actually serves from.
      #
      # Earlier the secrets pointed at `web@mge-eng.com`, which was
      # chrooted under /home/mgeengco/mge-eng.com/web/, so every
      # CI deploy silently landed in a sibling folder mge-eng.com
      # never read from.
      - name: Deploy frontend to public_html/out
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: public_html/out/
          local-dir: ./out/
          state-name: .frontend-deploy-state-v8.json
          exclude: |
            **/.git*
            **/.git*/**

      - name: Deploy WordPress CMS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}cms/
          local-dir: ./cms/
          state-name: .cms-deploy-state.json
          exclude: |
            **/.git*
            **/.git*/**
            **/wp-config.php
            **/wp-content/uploads/**
            **/wp-content/upgrade/**
            **/wp-content/cache/**
