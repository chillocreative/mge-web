name: Deploy to cPanel
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build Next.js static export
        run: npm run build
        env:
          NEXT_PUBLIC_WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}

      # The configured FTP user is rooted at /home/mgeengco/mge-eng.com/web/
      # (an addon-domain-scoped account), so a plain `public_html/out/`
      # resolves to /home/mgeengco/mge-eng.com/web/public_html/out/ — a
      # sibling folder that mge-eng.com does NOT serve from. The site's
      # actual document root is /home/mgeengco/public_html/out/, so we
      # have to traverse up two levels to reach it.
      #
      # If the FTP server enforces a strict chroot this `..` traversal
      # will fail and we'll need different FTP credentials (a main-account
      # user rooted at /home/mgeengco/) instead.
      - name: Deploy frontend to public_html/out
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ../../public_html/out/
          local-dir: ./out/
          state-name: .frontend-deploy-state-v8.json
          exclude: |
            **/.git*
            **/.git*/**

      - name: Deploy WordPress CMS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}cms/
          local-dir: ./cms/
          state-name: .cms-deploy-state.json
          exclude: |
            **/.git*
            **/.git*/**
            **/wp-config.php
            **/wp-content/uploads/**
            **/wp-content/upgrade/**
            **/wp-content/cache/**
